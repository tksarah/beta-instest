<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <title>InstantTest | ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="/assets/favicon/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/favicon/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/landing.css">
  <style>
    .login-heading{
      margin:8px 0 18px;
    }
    .login-heading h1{
      font-size:28px;
      margin-bottom:6px;
    }
    .login-method-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
      align-items:start;
    }
    .login-method-card{
      min-height:100%;
    }
    .login-method-card h2{
      font-size:22px;
      margin-bottom:10px;
    }
    .admin-stealth-wrap{
      display:flex;
      justify-content:flex-end;
      margin-top:42px;
      padding-top:18px;
      border-top:1px solid var(--border-soft);
    }
    .admin-stealth-access{
      display:grid;
      grid-template-columns:220px 52px;
      gap:12px;
      align-items:center;
      width:auto;
      opacity:.68;
    }
    .admin-stealth-access:focus-within,
    .admin-stealth-access:hover{
      opacity:1;
    }
    .admin-stealth-access input{
      width:220px;
      height:34px;
      padding:7px 9px;
      border-radius:8px;
      font-size:12px;
      background:rgba(255,255,255,.72);
    }
    .admin-stealth-access .btn{
      width:52px;
      height:34px;
      padding:7px 10px;
      border-radius:8px;
      font-size:12px;
    }
    .admin-stealth-access .status-message{
      grid-column:1 / -1;
      margin-top:0;
      min-height:1em;
      font-size:11px;
      text-align:right;
    }
    .visually-hidden{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }
    @media (max-width: 860px){
      .login-method-grid{
        grid-template-columns:1fr;
      }
      .admin-stealth-wrap{
        justify-content:flex-end;
      }
      .admin-stealth-access{
        grid-template-columns:minmax(160px,1fr) 52px;
        width:min(100%,320px);
        gap:8px;
      }
      .admin-stealth-access input{
        width:100%;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main-content">本文へスキップ</a>
  <main id="main-content" class="container">
    <header class="app-topbar" role="banner">
      <a class="app-brand" href="/" aria-label="InstantTest トップへ">
        <div class="app-brand-mark">IT</div>
        <div class="app-brand-copy"><strong>InstantTest</strong><span>講師ログイン</span></div>
      </a>
      <div class="app-topbar-actions">
        <a class="btn btn-ghost" href="/">トップへ</a>
      </div>
    </header>

    <div class="login-heading">
      <h1>ログイン方法を選択</h1>
      <p class="small">InstantTestへアクセスする方法を選んでください。</p>
    </div>

    <div class="login-method-grid">
      <section class="box login-method-card" aria-labelledby="google-login-title">
        <h2 id="google-login-title">Googleアカウントでログイン</h2>
        <p class="small" style="margin-bottom:18px;">無償ベータ版では、講師アカウントをGoogleログインで作成・利用できます。</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px;">
          <a id="google-login-link" class="btn btn-primary" href="/api/auth/google/start">Googleで続ける</a>
        </div>
        <div id="login-message" class="status-message" aria-live="polite"></div>
      </section>

      <section class="box login-method-card" aria-labelledby="legacy-login-title">
        <h2 id="legacy-login-title">ID/パスワードでログイン</h2>
        <p class="small" style="margin-bottom:14px;">管理者が作成した既存アカウント用の補助ログインです。</p>
        <form id="login-form" class="task-form-stack" autocomplete="on">
          <div style="display:grid;gap:8px;margin-bottom:12px;">
            <label for="username">ユーザー名</label>
            <input id="username" name="username" type="text" autocomplete="username" />
          </div>
          <div style="display:grid;gap:8px;margin-bottom:12px;">
            <label for="password">パスワード</label>
            <input id="password" name="password" type="password" autocomplete="current-password" />
          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
            <button class="btn btn-secondary" type="submit">ID/パスワードでログイン</button>
          </div>
        </form>

        <div class="admin-stealth-wrap">
          <form id="admin-access-form" class="admin-stealth-access" autocomplete="off">
            <label class="visually-hidden" for="admin-access-password">管理者パスワード</label>
            <input id="admin-access-password" type="password" autocomplete="current-password" placeholder="管理者パスワード" />
            <button id="admin-access-submit" class="btn btn-ghost" type="submit">管理</button>
            <div id="admin-access-message" class="status-message" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="/landing.js"></script>
  <script src="/login.js"></script>
</body>
</html>
